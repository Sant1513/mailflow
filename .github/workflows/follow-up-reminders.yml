# Follow-up reminders every 15 minutes. Vercel Hobby only allows daily crons
# (vercel.json keeps a daily backstop at 09:00 IST); this calls the same
# secured endpoint on the cadence the product wants.
name: follow-up-reminders
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/follow-ups
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://mailflow-six-sooty.vercel.app/api/cron/follow-ups"
