# Scheduled jobs. Vercel Hobby only allows daily crons (vercel.json keeps daily backstops);
# this calls the same secured endpoints on the cadence the product wants, while keeping
# Vercel's free CPU allowance: one cheap call every 15 minutes, the heavier jobs less often.
#   every 15 min  dispatch       starts the campaign / recruiter senders only if there is work
#   every 30 min  gmail-sync     every connected mailbox (replies show within 30 minutes)
#   hourly        follow-ups, sheets-sync
# Each step is independent (continue-on-error): one failing or slow endpoint must never stop
# the others — the senders run first because a stalled send is the costliest failure.
name: scheduled-jobs
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Start the senders if anything is waiting to go out
        continue-on-error: true
        run: |
          curl -fsS -m 30 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://mailflowbymasai.vercel.app/api/cron/dispatch?reason=github"
      - name: Sync every connected Gmail mailbox (every 30 minutes)
        continue-on-error: true
        run: |
          M=$((10#$(date -u +%M)))
          if [ "${{ github.event_name }}" != "schedule" ] || [ $((M % 30)) -lt 15 ]; then
            curl -fsS -m 70 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "https://mailflowbymasai.vercel.app/api/cron/gmail-sync"
          else
            echo "Not this quarter-hour (runs at :00 and :30)."
          fi
      - name: Follow-up reminders (hourly)
        continue-on-error: true
        run: |
          M=$((10#$(date -u +%M)))
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$M" -lt 15 ]; then
            curl -fsS -m 70 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "https://mailflowbymasai.vercel.app/api/cron/follow-ups"
          else
            echo "Runs once an hour (first quarter)."
          fi
      - name: Google Sheets two-way sync (hourly)
        continue-on-error: true
        run: |
          M=$((10#$(date -u +%M)))
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$M" -lt 15 ]; then
            curl -fsS -m 70 -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "https://mailflowbymasai.vercel.app/api/cron/sheets-sync"
          else
            echo "Runs once an hour (first quarter)."
          fi
